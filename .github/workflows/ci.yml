name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for the runner
        run: make

      - name: Smoke-test
        # --list-devices needs a camera attached, so it is not usable here.
        run: |
          ./uvc-util --version
          ./uvc-util --list-controls > /dev/null

      - name: Build universal binary
        run: |
          make clean
          make universal
          lipo -info uvc-util
          codesign --verify --verbose uvc-util

      - name: Check formula style
        run: brew style Formula/uvc-util.rb
